# Reference: https://github.com/i3/i3/blob/next/etc/config

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

on-focus-changed = 'move-mouse monitor-lazy-center'

[mode.main.binding]
alt-j = "focus-monitor --wrap-around next"
# See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
alt-slash = 'layout tiles horizontal vertical'
alt-shift-backslash = 'layout tiles horizontal horizontal'
alt-enter = '''exec-and-forget osascript -e '
tell application "Terminal"
    do script
    activate
end tell'
'''

# i3 wraps focus by default
cmd-shift-h = 'move left'
cmd-shift-j = 'move-workspace-to-monitor 1'
cmd-shift-k = 'move-workspace-to-monitor main'
cmd-shift-l = 'move right'

cmd-s = 'focus-monitor 1'
cmd-j = 'focus-monitor 1'
cmd-backslash = [
  'move-workspace-to-monitor next',
  'focus-monitor next'
]
cmd-k = 'focus-monitor main'
cmd-l = 'focus right'
cmd-h = 'focus left'

# Consider using 'join-with' command as a 'split' replacement if you want to enable normalizations
# cmd-minus = 'split horizontal' # ☹️ I cannot zoom out apps if I use this
cmd-slash = 'split vertical'

cmd-f = 'fullscreen'

cmd-q = 'close'
cmd-w = 'workspace-back-and-forth'

cmd-shift-backslash = 'layout v_accordion'           # 'layout stacking' in i3
cmd-shift-minus = 'layout h_accordion'               # 'layout tabbed' in i3
#cmd-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3 🥱 It conflicts with Obsidian's mode view toggle

alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3


# Not supported, because this command is redundant in AeroSpace mental model.
# See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
#alt-space = 'focus toggle_tiling_floating'

# `focus parent`/`focus child` are not yet supported, and it's not clear whether they
# should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
# alt-a = 'focus parent'

cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 10'

# --- Synergy interop -------------------------------------------------------
# Toggle focus between the two monitors (Sidecar <-> Built-in). With exactly
# two monitors, `focus-monitor --wrap-around next` IS the toggle: from Built-in
# it wraps to Sidecar, from Sidecar back to Built-in.
#
# Two separate input paths land here, because this Mac (hostname `alpha`) runs
# Synergy as a *client* -- the server owns the physical keyboard and swallows
# its own hotkeys, so they never arrive here as real keystrokes:
#
#   ctrl-alt-backslash  This Mac's own keyboard. Synergy is not involved at
#                       all, so AeroSpace sees Control+Option+\ natively.
#   f19                 Synthesized by the Synergy server right after
#                       switchToScreen(alpha). F19 carries no modifiers, so
#                       there is nothing for Linux/Windows/macOS to disagree
#                       about -- it sidesteps the ctrl/alt/meta mapping mess.
ctrl-alt-backslash = 'focus-monitor --wrap-around next'
# Every modifier permutation of F19 maps to the same toggle. Synergy fires the
# release-action while the physical Ctrl/Alt may still be held, so the key can
# arrive decorated with modifiers depending on release order. Binding all of
# them makes the result independent of how you let go of the combo.
f19 = 'focus-monitor --wrap-around next'
ctrl-f19 = 'focus-monitor --wrap-around next'
alt-f19 = 'focus-monitor --wrap-around next'
ctrl-alt-f19 = 'focus-monitor --wrap-around next'
cmd-f19 = 'focus-monitor --wrap-around next'
cmd-alt-f19 = 'focus-monitor --wrap-around next'
# Fallback if a synthesized bare F19 doesn't come through: switch the Synergy
# side to `keystroke(Meta+Alt+Backslash)` and uncomment this line instead.
# cmd-alt-backslash = 'focus-monitor --wrap-around next'

cmd-r = 'reload-config'

alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'

enter = 'mode main'
esc = 'mode main'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = "com.googlecode.iterm2"
run = ["move-node-to-workspace 5"]

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace 9', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.carriez.rustdesk'
run = 'move-node-to-workspace 0'

[workspace-to-monitor-force-assignment]
# Pinned by display-name regex (case-insensitive) instead of main/secondary,
# so the mapping survives rearranging displays or moving the menu bar.
# Second element is the fallback when that display isn't connected.
1 = ['sidecar', 'main']
2 = ['sidecar', 'main']
3 = ['sidecar', 'main']
4 = ['sidecar', 'main']
5 = ['sidecar', 'main']
6 = ['built-in', 'main']
7 = ['built-in', 'main']
8 = ['built-in', 'main']
9 = ['built-in', 'main']
10 = ['built-in', 'main']
