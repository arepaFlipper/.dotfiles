"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$hostname\
[](bg:green_dir fg:green_host)\
$directory\
[](fg:green_dir bg:blue_dark)\
$git_branch\
$git_status\
[](fg:blue_dark bg:midnight_mid)\
$nodejs\
$rust\
$golang\
$php\
[](fg:midnight_mid bg:midnight)\
$time\
[ ](fg:midnight)\
\n$character"""

palette = 'mint_gradient'

[palettes.mint_gradient]
arch_blue = '#1793d1'

green_os   = '#92B662'
green_user = '#95B965'
green_host = '#98C167'
green_dir  = '#A1C470'

mint_green = '#86BE43'
green_mid = '#92B662'
green_mint = '#92B500'
green_path = '#ADFFC3'
blue_mid = '#0074ae'
blue_dark = '#394260'
midnight_mid = '#212736'
midnight = '#1d2230'
text_dark = '#090c0c'
text_light = '#e3e5e5'
text_accent = '#769ff0'
text_muted = '#a0a9cb'
separator = '#a3aed2'
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
russian_green = '#68A063'
fluo_green = '#17fc03'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'
yellow_dark = '#d5b60a'

[os]
format = "[](green_os)[$symbol](bg:green_os fg:text_light)[](green_os)"
style = "bg:green_os fg:text_light"
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[aws]
symbol = "  "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cpp]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[gcloud]
symbol = "  "

[git_commit]
tag_symbol = '  '

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[ocaml]
symbol = " "

[username]
show_always = true
style_user = "bg:green_user fg:text_light"
style_root = "bg:color_green fg:text_light"
format = '[](fg:black bg:green_user)[ $user]($style)'
# format = '[[](fg:green_os bg:green_user)][$user]($style)'

[hostname]
ssh_symbol = " "
ssh_only = false
format = "[@$hostname ]($style)"
# format = '[[](fg:green_user bg:green_host)][@$hostname]($style)'
style = "bg:green_host fg:text_light"
disabled = false

[directory]
read_only = "󰌾 "
style = "fg:text_dark bg:green_dir"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰉍 "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = "󰊢"
style = "bg:blue_dark fg:color_red"
format = '[[ $symbol ](fg:color_red bg:blue_dark)[ $branch ](fg:white bg:blue_dark)]($style)'

[git_status]
style = "bg:blue_dark"
format = '[[($all_status$ahead_behind )](fg:text_accent bg:blue_dark)]($style)'

[package]
symbol = "󰏗 "

[python]
symbol = " "
style = "bg:color_yellow fg:black"
format = '[[($all_status$ahead_behind )](fg:text_accent bg:color_yellow)]($style)'
pyenv_version_name = true
detect_files = ['.python-version', 'Pipfile', '__init__.py', 'pyproject.toml', 'requirements.txt', 'setup.py', 'tox.ini']
disabled = false

[nodejs]
symbol = " "
style = "bg:russian_green"
format = '[[ $symbol ($version) ](fg:fluo_green bg:midnight_mid)]($style)'

[rust]
symbol = "󱘗 "
style = "bg:midnight_mid"
format = '[[ $symbol ($version) ](fg:text_accent bg:midnight_mid)]($style)'

[golang]
symbol = " "
style = "bg:midnight_mid"
format = '[[ $symbol ($version) ](fg:text_accent bg:midnight_mid)]($style)'

[php]
symbol = ""
style = "bg:midnight_mid"
format = '[[ $symbol ($version) ](fg:text_accent bg:midnight_mid)]($style)'


[character]
success_symbol = '[🤑](fluo_green)'
error_symbol = '[😵](color_red)'
vimcmd_symbol = '[ ](white) '
vimcmd_replace_one_symbol = '[ ](yellow_dark) '
vimcmd_replace_symbol = '[ ](color_yellow) '
vimcmd_visual_symbol = '[🥽](bold fg:midnight)'
