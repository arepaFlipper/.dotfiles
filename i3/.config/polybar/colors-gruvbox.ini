; Gruvbox Dark (https://github.com/morhetz/gruvbox), official hex values,
; mapped onto the same key names config.ini already references so the
; rest of the file never needs to change per machine -- only which
; colors-*.ini gets symlinked to colors.ini differs.
[colors]
base = #32302f
mantle = #282828
crust = #1d2021
text = #ebdbb2
subtext0 = #a89984
subtext1 = #bdae93
surface0 = #3c3836
surface1 = #504945
surface2 = #665c54
overlay0 = #7c6f64
overlay1 = #928374
overlay2 = #a89984
blue = #83a598
lavender = #d3869b
sapphire = #458588
sky = #8ec07c
teal = #689d6a
green = #b8bb26
yellow = #fabd2f
peach = #d65d0e
maroon = #cc241d
red = #fb4934
mauve = #d3869b
pink = #d3869b
flamingo = #fe8019
rosewater = #d65d0e
transparent = #00000000

[colors]
background = ${colors.base}
background-alt = ${colors.blue}
foreground = ${colors.text}
primary = ${colors.mauve}
secondary = ${colors.mantle}
alert = ${colors.red}
disabled = ${colors.subtext1}
