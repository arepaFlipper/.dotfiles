; Everforest Dark Hard (https://github.com/sainnhe/everforest), same
; palette already used for NixOS's starship prompt (see
; NixOS/.config/home-manager/modules/shell.nix), mapped onto the same key
; names config.ini already references so the rest of the file never needs
; to change per machine -- only which colors-*.ini gets symlinked to
; colors.ini differs.
[colors]
base = #272E33
mantle = #2E383C
crust = #1E2326
text = #D3C6AA
subtext0 = #859289
subtext1 = #9DA9A0
surface0 = #374145
surface1 = #414B50
surface2 = #495156
overlay0 = #4F5B58
overlay1 = #7A8478
overlay2 = #859289
blue = #7FBBB3
lavender = #D699B6
sapphire = #83C092
sky = #83C092
teal = #83C092
green = #A7C080
yellow = #DBBC7F
peach = #E69875
maroon = #E67E80
red = #E67E80
mauve = #D699B6
pink = #D699B6
flamingo = #E69875
rosewater = #493B40
transparent = #00000000

[colors]
background = ${colors.base}
background-alt = ${colors.blue}
foreground = ${colors.text}
primary = ${colors.mauve}
secondary = ${colors.mantle}
alert = ${colors.red}
disabled = ${colors.subtext1}
